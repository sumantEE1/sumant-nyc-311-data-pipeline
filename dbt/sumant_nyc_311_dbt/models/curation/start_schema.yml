version: 2
models:
  - name: dim_311_complaint
    config:
      contract:
        enforced: true
    columns:
      - name: complaint_key
        data_type: varchar(200)
        tests:
          - unique
          - not_null
      - name: complaint_type
        data_type: varchar(200)
      - name: descriptor
        data_type: varchar(200)
  - name: fct_311_service_requests
    description: "Test fact table"
    columns:
      - name: unique_key
        data_type: varchar(200)
        data_tests:
          - not_null
          - unique
      - name: created_date
        data_type: timestamp
        data_tests:
          - not_null
      - name: complaint_key
        data_type: varchar(200)
        tests:
          - not_null
          - relationships:
              to: ref('dim_311_complaint')
              field: complaint_key
      - name: unique_key
        data_type: varchar(200)
      - name: agency
        data_type: varchar(200)
      - name: borough
        data_type: varchar(200)
      - name: status
        data_type: varchar(200)
      - name: open_data_channel_type
        data_type: varchar(200)
      - name: created_date
        data_type: varchar(200)
      - name: resolution_action_updated_date
        data_type: timestamp
      - name: created_year
        data_type: varchar(200)
      - name: created_month
        data_type: varchar(200)
      - name: is_closed
        data_type: varchar(200)
      - name: resolution_hours
        data_type: varchar(200)
      - name: ingested_a
        data_type: timestamp