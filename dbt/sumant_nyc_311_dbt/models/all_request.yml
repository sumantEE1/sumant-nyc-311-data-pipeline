version: 2
models:
  - name: dq_311_service_requests_test
    description: "This test table was created to read bad 311 service requests and test the unique_key test after partitioning by unique key and order by created date desc"
    columns:
      - name: unique_key
        data_tests:
          - not_null
          - unique
      - name: created_date
        data_tests:
          - not_null
      - name: borough
        data_tests:
          - accepted_values:
              values: 
                - bronx
                - brooklyn
                - manhattan
                - queens
                - staten_island
                - _11211
                - unspecified