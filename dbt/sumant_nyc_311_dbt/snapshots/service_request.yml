snapshots:
  - name: nyc_311_service_request_snapshot
    relation: ref('stg_311_service_requests') # source('my_source', 'my_table') or ref('my_model')
    description: "This snapshot is created using stg service requests"
    config:
      database: DE_CROSS_SKILLING_NYC_311
      schema: staging
      strategy: check
      unique_key: unique_key
      check_cols: 
        - status
        - closed_date
        - resolution_action_updated_date
      updated_at: ingested_at
      # dbt_valid_to_current: "to_date('2026-12-31')" # Specifies that current records should have `dbt_valid_to` set to `'9999-12-31'` instead of `NULL`.